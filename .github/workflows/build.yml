name: Build AppSync

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  build:
    name: Build (macOS / Theos)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Homebrew deps
        run: |
          set -e
          brew update || true
          brew install dpkg || true
          brew install ldid || true
        shell: bash
        
      - name: Install Theos
        run: |
          git clone --depth=1 https://github.com/theos/theos.git $HOME/theos
          export THEOS="$HOME/theos"
          # populate vendor/include and vendor/lib
          "$THEOS/bin/update-theos"
        env:
          THEOS: ${{ runner.temp }}/theos
      
      - name: Set THEOS env
        run: |
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build package
        env:
          THEOS: ${{ env.THEOS }}
        run: |
          set -ex
          make clean || true
          if command -v dm.pl >/dev/null 2>&1; then
            echo "dm.pl found: running make package"
            make package
          else
            make
          fi
        shell: bash

      - name: List possible artifacts
        run: |
          echo "Looking for .deb files"
          ls -la || true
          ls -la packages || true
          find . -type f -name "*.deb" -print || true
        shell: bash

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: appsync-deb
          path: |
            *.deb
            packages/**/*.deb
            packages/*.deb
